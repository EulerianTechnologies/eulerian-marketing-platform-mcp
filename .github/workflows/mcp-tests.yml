name: Run MCP Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          EMP_API_ENDPOINT: ${{ secrets.EMP_API_ENDPOINT }}
          EMP_API_TOKEN: ${{ secrets.EMP_API_TOKEN }}
        run: |
          pytest tests/ -v -s -c tests/pytest.ini
