name: MCP Conformance Tests

on:
  # Triggered by the remote Eulerian server's deployment pipeline
  repository_dispatch:
    types: [remote-server-deployed]
  # Manual run
  workflow_dispatch:
  # Daily safety net at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'

jobs:
  # -------------------------------------------------------------------------
  # Layer 1: direct HTTP — does the remote server speak valid JSON-RPC?
  # -------------------------------------------------------------------------
  http-conformance:
    name: Direct HTTP (remote server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run direct HTTP tests
        env:
          EMP_API_ENDPOINT: ${{ secrets.EMP_API_ENDPOINT }}
          EMP_API_TOKEN: ${{ secrets.EMP_API_TOKEN }}
        run: pytest tests/test_mcp_loop.py -v -s -c tests/pytest.ini

  # -------------------------------------------------------------------------
  # Layer 2: proxy stdio — does the full chain (proxy + remote) conform to spec?
  # -------------------------------------------------------------------------
  proxy-conformance:
    name: Proxy stdio (full chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install -e .

      - name: Run proxy conformance tests
        env:
          EMP_API_ENDPOINT: ${{ secrets.EMP_API_ENDPOINT }}
          EMP_API_TOKEN: ${{ secrets.EMP_API_TOKEN }}
        run: pytest tests/test_proxy_conformance.py -v -s

  # -------------------------------------------------------------------------
  # Layer 3: MCP Inspector CLI — visual spec conformance probe
  # -------------------------------------------------------------------------
  inspector:
    name: MCP Inspector CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install package
        run: pip install -e .

      - name: Probe — tools/list
        env:
          EMP_API_ENDPOINT: ${{ secrets.EMP_API_ENDPOINT }}
          EMP_API_TOKEN: ${{ secrets.EMP_API_TOKEN }}
        run: |
          npx --yes @modelcontextprotocol/inspector --cli \
            python -m eulerian_marketing_platform.server \
            --method tools/list

      - name: Probe — tool call (getallowedwebsite_account)
        env:
          EMP_API_ENDPOINT: ${{ secrets.EMP_API_ENDPOINT }}
          EMP_API_TOKEN: ${{ secrets.EMP_API_TOKEN }}
        run: |
          npx --yes @modelcontextprotocol/inspector --cli \
            python -m eulerian_marketing_platform.server \
            --method tools/call \
            --tool-name getallowedwebsite_account

  # -------------------------------------------------------------------------
  # Notify on failure
  # -------------------------------------------------------------------------
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [http-conformance, proxy-conformance, inspector]
    if: failure()
    steps:
      - name: Open a GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;
            const payload = context.payload.client_payload ?? {};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## MCP Conformance failure',
              '',
              `**Trigger:** \`${event}\``,
              payload.version ? `**Remote server version:** \`${payload.version}\`` : '',
              '',
              `[View failed run](${runUrl})`,
            ].filter(Boolean).join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[conformance] MCP spec failure — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['conformance', 'bug'],
            });
